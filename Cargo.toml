[workspace]
resolver = "2"
members = [
    "crates/dualcraft",
    "crates/common",
    "crates/protocol-java",
    "crates/protocol-bedrock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Community"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
